<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MGetAnswerList 节点答案查看器</title>
        <style>
            :root {
                --bg: #f5f6fa;
                --card-bg: #fff;
                --border: #e4e7ed;
                --text-main: #1d2129;
                --text-sub: #4e5969;
                --text-light: #86909c;
                --primary: #165dff;
                --primary-light: #e8f3ff;
                --sidebar-width: 380px;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text-main);
                height: 100vh;
                overflow: hidden;
                display: flex;
            }

            /* ===== 左侧面板 ===== */
            .sidebar {
                width: var(--sidebar-width);
                min-width: 320px;
                max-width: 500px;
                background: var(--card-bg);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                padding: 20px;
                gap: 12px;
                flex-shrink: 0;
                resize: horizontal;
                overflow: auto;
            }
            .sidebar h1 {
                font-size: 16px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 4px;
            }
            .sidebar h1::before {
                content: '';
                display: block;
                width: 4px;
                height: 18px;
                background: var(--primary);
                border-radius: 2px;
            }
            textarea {
                flex: 1;
                min-height: 200px;
                resize: none;
                padding: 12px;
                font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
                font-size: 13px;
                line-height: 1.5;
                border: 1px solid var(--border);
                border-radius: 6px;
                outline: none;
                background: #fafbfc;
                transition:
                    border-color 0.2s,
                    background 0.2s;
            }
            textarea:focus {
                border-color: var(--primary);
                background: #fff;
            }
            .btn-row {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            button {
                padding: 9px 18px;
                background: var(--primary);
                color: #fff;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.2s;
                white-space: nowrap;
            }
            button:hover {
                opacity: 0.9;
            }
            button:active {
                transform: scale(0.97);
            }
            button.sec {
                background: #fff;
                color: var(--text-sub);
                border: 1px solid var(--border);
            }
            button.sec:hover {
                background: #f7f8fa;
            }
            .status {
                font-size: 12px;
                line-height: 1.5;
                word-break: break-word;
                min-height: 18px;
            }
            .status.err {
                color: #f53f3f;
            }
            .hint {
                font-size: 11px;
                color: var(--text-light);
                line-height: 1.5;
            }

            /* ===== 右侧内容区 ===== */
            .main {
                flex: 1;
                overflow-y: auto;
                padding: 24px 28px;
            }
            .topic-group {
                margin-bottom: 32px;
            }
            .topic-title {
                font-size: 16px;
                font-weight: 700;
                margin-bottom: 14px;
                padding-bottom: 8px;
                border-bottom: 2px solid var(--primary);
                display: inline-block;
            }
            .node-card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 18px 20px;
                margin-bottom: 14px;
                transition: box-shadow 0.2s;
            }
            .node-card:hover {
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            }
            .node-name {
                font-size: 15px;
                font-weight: 700;
                margin-bottom: 16px;
                color: var(--text-main);
            }

            /* ===== 分组标题 ===== */
            .section-title {
                font-size: 12px;
                font-weight: 700;
                color: var(--primary);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin: 16px 0 10px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .section-title:first-of-type {
                margin-top: 0;
            }
            .section-title::after {
                content: '';
                flex: 1;
                height: 1px;
                background: var(--border);
            }

            /* ===== ✨ 维度评估网格布局 ===== */
            .dim-grid {
                display: grid;
                gap: 10px;
            }
            .dim-item {
                background: #fafbfc;
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 12px 14px;
                transition:
                    border-color 0.2s,
                    background 0.2s;
            }
            .dim-item:hover {
                border-color: #c9cdd4;
                background: #f5f6fa;
            }
            .dim-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 6px;
            }
            .dim-label {
                font-size: 12px;
                color: var(--text-light);
                font-weight: 500;
            }
            .dim-value {
                font-size: 13px;
                font-weight: 700;
                color: var(--text-main);
                word-break: break-word;
                text-align: right;
                max-width: 60%;
            }
            .dim-value.na {
                color: var(--text-light);
                font-weight: 400;
                font-style: italic;
            }
            .dim-reason-box {
                margin-top: 8px;
                padding: 8px 10px;
                border-radius: 6px;
                background: var(--primary-light);
                border-left: 3px solid var(--primary);
                font-size: 12px;
                color: var(--text-sub);
                line-height: 1.6;
                word-break: break-word;
            }
            .dim-reason-box:empty {
                display: none;
            }

            /* ===== 整体结论高亮卡片 ===== */
            .overall-card {
                margin-top: 14px;
                padding: 14px 16px;
                border-radius: 8px;
                background: linear-gradient(135deg, #f0f5ff 0%, #f5f6fa 100%);
                border: 1px solid #d6e4ff;
            }
            .overall-label {
                font-size: 11px;
                color: var(--primary);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 6px;
            }
            .overall-value {
                font-size: 15px;
                font-weight: 700;
                color: var(--primary);
                margin-bottom: 8px;
                word-break: break-word;
            }
            .overall-value.na {
                color: var(--text-light);
                font-weight: 400;
                font-style: italic;
                font-size: 13px;
            }
            .overall-reason {
                padding: 10px 12px;
                border-radius: 6px;
                background: rgba(255, 255, 255, 0.7);
                font-size: 12px;
                color: var(--text-sub);
                line-height: 1.6;
                word-break: break-word;
            }
            .overall-reason:empty {
                display: none;
            }

            .empty {
                text-align: center;
                padding: 80px 20px;
                color: var(--text-light);
                font-size: 14px;
            }
            .parse-warn {
                font-size: 12px;
                color: #ff7d00;
                margin-top: 8px;
                padding: 8px 10px;
                background: #fff7e8;
                border-radius: 6px;
            }

            @media (max-width: 768px) {
                body {
                    flex-direction: column;
                    height: auto;
                    overflow: auto;
                }
                .sidebar {
                    width: 100%;
                    max-width: none;
                    min-width: 0;
                    border-right: none;
                    border-bottom: 1px solid var(--border);
                    resize: none;
                }
                textarea {
                    min-height: 120px;
                    flex: none;
                }
                .main {
                    padding: 16px;
                }
                .dim-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <!-- 左侧：输入与操作 -->
        <div class="sidebar">
            <h1>节点答案查看器</h1>
            <textarea
                id="jsonInput"
                placeholder="点击「粘贴并展示」自动读取剪贴板&#10;或手动粘贴 / 输入 JSON，内容变化后自动解析..."
            ></textarea>
            <div class="btn-row">
                <button id="pasteBtn" onclick="pasteAndRender()">
                    📋 粘贴并展示
                </button>
                <button class="sec" onclick="clearAll()">清空</button>
            </div>
            <div id="statusEl" class="status"></div>
            <div class="hint">
                💡 输入框内容变化后自动解析<br />🖱️ 拖拽右边缘可调整左侧宽度
            </div>
        </div>

        <!-- 右侧：结果展示 -->
        <div class="main" id="output">
            <div class="empty">等待粘贴数据...</div>
        </div>

        <script>
            const DIMENSIONS = [
                { key: 'promptCompliance', label: '可见 Prompt 符合度' },
                { key: 'layoutHierarchy', label: '布局层级' },
                { key: 'colorTypography', label: '色彩排版' },
                { key: 'assetRendering', label: '素材渲染' },
                { key: 'consistency', label: '一致性' }
            ]

            let debounceTimer = null
            document
                .getElementById('jsonInput')
                .addEventListener('input', () => {
                    clearTimeout(debounceTimer)
                    debounceTimer = setTimeout(parseAndRender, 150)
                })

            async function pasteAndRender() {
                const inputEl = document.getElementById('jsonInput')
                const statusEl = document.getElementById('statusEl')
                const btn = document.getElementById('pasteBtn')
                try {
                    if (!navigator.clipboard || !navigator.clipboard.readText)
                        throw new Error('当前环境不支持 Clipboard API')
                    const text = await navigator.clipboard.readText()
                    if (!text || !text.trim()) {
                        statusEl.textContent = '⚠️ 剪贴板为空'
                        statusEl.className = 'status err'
                        return
                    }
                    inputEl.value = text.trim()
                    inputEl.dispatchEvent(new Event('input'))
                    btn.textContent = '✅ 已粘贴'
                    setTimeout(() => {
                        btn.textContent = '📋 粘贴并展示'
                    }, 800)
                } catch (e) {
                    statusEl.textContent = `⚠️ 无法读取剪贴板（${e.message}）\n请手动 Ctrl+V 粘贴，内容会自动解析`
                    statusEl.className = 'status err'
                    inputEl.focus()
                }
            }

            function getField(obj, key) {
                if (!obj || typeof obj !== 'object') return undefined
                return (
                    obj[key] ??
                    obj[key.charAt(0).toUpperCase() + key.slice(1)] ??
                    obj[key.toUpperCase()]
                )
            }

            function buildDimItemHtml(data, dim) {
                const value = getField(data, dim.key)
                const reason = getField(data, dim.key + 'Reason')
                const hasValue =
                    value !== undefined && value !== null && value !== ''
                const valDisplay = hasValue
                    ? escapeHtml(String(value))
                    : '<span class="na">-</span>'
                const reasonHtml =
                    reason !== undefined && reason !== null && reason !== ''
                        ? `<div class="dim-reason-box">${escapeHtml(String(reason))}</div>`
                        : ''

                return `
        <div class="dim-item">
            <div class="dim-header">
                <span class="dim-label">${dim.label}</span>
                <span class="dim-value ${hasValue ? '' : 'na'}">${valDisplay}</span>
            </div>
            ${reasonHtml}
        </div>`
            }

            function buildOverallHtml(data) {
                const pref = getField(data, 'overallPreference')
                const reason = getField(data, 'overallReason')
                const hasPref =
                    pref !== undefined && pref !== null && pref !== ''
                const prefDisplay = hasPref
                    ? escapeHtml(String(pref))
                    : '<span class="na">-</span>'
                const reasonHtml =
                    reason !== undefined && reason !== null && reason !== ''
                        ? `<div class="overall-reason">${escapeHtml(String(reason))}</div>`
                        : ''

                return `
        <div class="overall-card">
            <div class="overall-label">整体偏序结论</div>
            <div class="overall-value ${hasPref ? '' : 'na'}">${prefDisplay}</div>
            ${reasonHtml}
        </div>`
            }

            function parseAndRender() {
                const raw = document.getElementById('jsonInput').value.trim()
                const statusEl = document.getElementById('statusEl')
                const outputEl = document.getElementById('output')

                if (!raw) {
                    outputEl.innerHTML =
                        '<div class="empty">等待粘贴数据...</div>'
                    statusEl.textContent = ''
                    statusEl.className = 'status'
                    return
                }
                try {
                    const json = JSON.parse(raw)
                    const answerList =
                        json.AnswerList ||
                        json.data?.AnswerList ||
                        json.Result?.AnswerList ||
                        json
                    if (
                        typeof answerList !== 'object' ||
                        Array.isArray(answerList)
                    )
                        throw new Error(
                            '未找到有效的 AnswerList 对象（期望格式: {题目id: [节点数组]}）'
                        )

                    const topicIds = Object.keys(answerList)
                    if (topicIds.length === 0) {
                        outputEl.innerHTML =
                            '<div class="empty">AnswerList 为空</div>'
                        statusEl.textContent = ''
                        return
                    }

                    let html = '',
                        totalNodes = 0,
                        parseErrors = 0
                    topicIds.forEach((topicId) => {
                        const nodes = answerList[topicId]
                        if (!Array.isArray(nodes)) return
                        let nodesHtml = ''
                        nodes.forEach((node) => {
                            totalNodes++
                            const nodeName = node.NodeName || '未命名节点'
                            let parsed = null,
                                warnMsg = ''
                            try {
                                if (typeof node.NodeAnswer === 'string')
                                    parsed = JSON.parse(node.NodeAnswer)
                                else if (
                                    typeof node.NodeAnswer === 'object' &&
                                    node.NodeAnswer !== null
                                )
                                    parsed = node.NodeAnswer
                            } catch (e) {
                                parseErrors++
                                warnMsg = `NodeAnswer 解析失败: ${e.message}`
                            }

                            const data = parsed?.data || parsed?.Data || {}
                            const dimsHtml = DIMENSIONS.map((dim) =>
                                buildDimItemHtml(data, dim)
                            ).join('')
                            const overallHtml = buildOverallHtml(data)

                            nodesHtml += `
                    <div class="node-card">
                        <div class="node-name">${escapeHtml(nodeName)}</div>
                        <div class="section-title">维度评估</div>
                        <div class="dim-grid">${dimsHtml}</div>
                        <div class="section-title">整体结论</div>
                        ${overallHtml}
                        ${warnMsg ? `<div class="parse-warn">⚠️ ${escapeHtml(warnMsg)}</div>` : ''}
                    </div>`
                        })
                        if (nodesHtml) {
                            html += `<div class="topic-group"><div class="topic-title">题目 ${escapeHtml(topicId)}</div>${nodesHtml}</div>`
                        }
                    })

                    outputEl.innerHTML =
                        html || '<div class="empty">无有效节点数据</div>'
                    let msg = `✅ ${topicIds.length} 个题目，${totalNodes} 个节点`
                    if (parseErrors > 0)
                        msg += `\n⚠️ ${parseErrors} 个NodeAnswer解析失败`
                    statusEl.textContent = msg
                    statusEl.className = 'status'
                } catch (e) {
                    statusEl.textContent = `❌ ${e.message}`
                    statusEl.className = 'status err'
                    outputEl.innerHTML = ''
                }
            }

            function escapeHtml(str) {
                const d = document.createElement('div')
                d.textContent = str
                return d.innerHTML
            }
            function clearAll() {
                const el = document.getElementById('jsonInput')
                el.value = ''
                el.dispatchEvent(new Event('input'))
            }
        </script>
    </body>
</html>
